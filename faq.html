    <div class="container" style="max-width:800px">
      <h1 class="section-title" data-i18n="faq.title">常见问题</h1>
      <details class="faq-item" open><summary>行程可以私人定制吗？</summary><div class="ans">可以，所有线路支持私家定制，详见「定制游」页面提交需求。</div></details>
      <details class="faq-item"><summary>价格包含机票吗？</summary><div class="ans">标准团含国际/内陆机票含税及行李额度，详见各线路「额外信息」Tab。</div></details>
      <details class="faq-item"><summary>单人出行怎么算房差？</summary><div class="ans">单人需补单人房差，或安排拼房，详情见费用说明。</div></details>
      <details class="faq-item"><summary>签证和保险谁负责？</summary><div class="ans">护照签证费用不含；建议自行购买旅游保险，出行前确认健康与签证要求。</div></details>
      <details class="faq-item"><summary>退改政策如何？</summary><div class="ans">按出发前天数阶梯扣款，详见线路「退改政策」Tab，以合同为准。</div></details>
      <details class="faq-item"><summary>支持哪些语言服务？</summary><div class="ans">全程中文领队，中英双语服务，适配本地居民与华人客群。</div></details>
